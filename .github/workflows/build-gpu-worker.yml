name: Build & Push GPU Worker

on:
  push:
    branches: [main]
    paths:
      - 'gpu-server/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu-server/Dockerfile
          push: true
          tags: |
            chrisjpmcdonald/origin-sports-analysis:latest
            chrisjpmcdonald/origin-sports-analysis:${{ github.sha }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
